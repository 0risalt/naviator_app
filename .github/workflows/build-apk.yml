name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Новый запуск на той же ветке отменяет предыдущий
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # нужно только для публикации релиза по тегу v*

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Проект может лежать как в корне репозитория, так и во вложенной папке.
      # Ищем pubspec.yaml (берём самый "верхний") и запоминаем его папку.
      - name: Find Flutter project
        run: |
          PUBSPEC=$(find . -maxdepth 4 -name pubspec.yaml \
            -not -path '*/.*' -not -path '*/build/*' \
            | awk '{ print length($0), $0 }' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml не найден в репозитории. Содержимое корня:"
            ls -la
            exit 1
          fi
          APP_DIR=$(dirname "$PUBSPEC")
          echo "Flutter-проект: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
        # Чтобы зафиксировать версию, как у вас локально:
        #   flutter-version: '3.xx.x'   (узнать: flutter --version)

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        # Замечания анализатора не блокируют сборку APK;
        # настоящие ошибки компиляции упадут на шаге Build.
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigator-app-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
